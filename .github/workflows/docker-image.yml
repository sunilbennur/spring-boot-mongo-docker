name: Simple CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "Hello, GitHub Actions!"

      - name: Run a simple shell command
        run: |
          echo "Current directory:"
          pwd
          echo "List files:"
          ls -l
